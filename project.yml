name: VibeNotepad
options:
  bundleIdPrefix: com.fredymederos
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  VibeCore:
    path: Packages/VibeCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  VibeNotepad:
    type: application
    platform: macOS
    sources:
      - path: VibeNotepad
    dependencies:
      - package: VibeCore
        product: VibeCore
    settings:
      # Debug builds get their own identity (name, bundle id, URL scheme, preferences and data
      # folder) so they never take over links or "Open With" from the installed app.
      configs:
        Debug:
          PRODUCT_NAME: "Vibe Notepad Dev"
          PRODUCT_BUNDLE_IDENTIFIER: com.fredymederos.vibenotepad.dev
          VIBE_DISPLAY_NAME: "Vibe Notepad Dev"
          VIBE_URL_SCHEME: vibenotepad-dev
        Release:
          PRODUCT_NAME: "Vibe Notepad"
          PRODUCT_BUNDLE_IDENTIFIER: com.fredymederos.vibenotepad
          VIBE_DISPLAY_NAME: "Vibe Notepad"
          VIBE_URL_SCHEME: vibenotepad
      base:
        PRODUCT_MODULE_NAME: VibeNotepad
        INFOPLIST_FILE: VibeNotepad/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        # The build-info script reads git and edits the built Info.plist.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Stamp build info
        basedOnDependencyAnalysis: false
        # Declared so it runs after Xcode has written the Info.plist.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          # Build number = number of commits; also records the commit and when the build happened
          # (shown in Settings → General → About).
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          buddy=/usr/libexec/PlistBuddy
          set_string() { "$buddy" -c "Set :$1 $2" "$plist" 2>/dev/null || "$buddy" -c "Add :$1 string $2" "$plist"; }
          if count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null); then
            "$buddy" -c "Set :CFBundleVersion $count" "$plist"
            commit=$(git -C "$SRCROOT" rev-parse --short HEAD)
            # A trailing + marks a build with uncommitted changes.
            [ -n "$(git -C "$SRCROOT" status --porcelain --untracked-files=no 2>/dev/null)" ] && commit="$commit+"
            set_string VibeGitCommit "$commit"
          fi
          set_string VibeBuildDate "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

schemes:
  VibeNotepad:
    build:
      targets:
        VibeNotepad: all
    run:
      config: Debug
    archive:
      config: Release
